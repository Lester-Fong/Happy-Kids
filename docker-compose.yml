version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: happykids-app
        container_name: happykids-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - mysql
        networks:
            - happykids

    node:
        image: node:14
        container_name: happykids-node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        command: sh -c "npm install && npm run dev"
        networks:
            - happykids

    mysql:
        image: mysql:5.7
        container_name: happykids-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: happykids
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: happykids
            MYSQL_PASSWORD: happykids
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - happykids

    nginx:
        image: nginx:alpine
        container_name: happykids-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./nginx/conf.d:/etc/nginx/conf.d
        depends_on:
            - app
        networks:
            - happykids

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: happykids-phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: happykids-mysql
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8080:80"
        networks:
            - happykids

volumes:
    dbdata:

networks:
    happykids:
        driver: bridge
