version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: happykids-app
        container_name: happykids-app
        restart: unless-stopped
        working_dir: /var/www
        ports:
            - "80:80" # Expose port 80 for web access
        volumes:
            - ./:/var/www # Optional: mount source if you want live syncing during development
        depends_on:
            - mysql
        networks:
            - happykids

    mysql:
        image: mysql:5.7
        container_name: happykids-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: happykids
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: happykids
            MYSQL_PASSWORD: happykids
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - happykids

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: happykids-phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: happykids-mysql
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8080:80"
        networks:
            - happykids

volumes:
    dbdata:

networks:
    happykids:
        driver: bridge
